[tool.poetry]
name = "habit-tracker-bot"
version = "0.1.0"
description = "Чат-бот для трекинга привычек в MAX"
authors = ["Zinnurov Lenar <zinnurov.lenar@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.13"
uvicorn = "^0.34.0"
sqlalchemy = "^2.0.0"
alembic = "^1.12.0"
asyncpg = "^0.30.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
pyjwt = "^2.8.0"
passlib = "^1.7.4"
bcrypt = "^4.0.1"
maxapi = "^1.2.1"
apscheduler = "^3.10.0"
httpx = "^0.27.0"
psycopg2-binary = "^2.9.9"
pytz = "^2026.3.post1"
pytest-asyncio = "^0.23.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
isort = "^5.12.0"
pylint = "^3.0.0"
mypy = "^1.7.0"
pytest-cov = "^4.1.0"

[tool.poetry.group.dev.dependencies]
freezegun = "^1.5.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# НАСТРОЙКИ ИНСТРУМЕНТОВ

# ---------- BLACK ----------
[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

# ---------- ISORT ----------
[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["migrations", ".venv", "__pycache__"]
known_first_party = ["backend", "bot"]
known_third_party = ["fastapi", "sqlalchemy", "alembic", "pydantic", "maxapi", "httpx"]

# ---------- PYLINT ----------
[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0801",  # duplicate-code
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0718",  # broad-exception-caught
    "W1203",  # logging-fstring-interpolation
    "C0301",  # line-too-long
    "W0611",  # unused-import
    "W0621",  # redefined-outer-name
    "C0415",  # import-outside-toplevel
    "E1101",  # no-member
    "C0121",  # singleton-comparison
    "R1731",  # consider-using-max-builtin
    "W1508",  # invalid-envvar-default
    "W0108",  # unnecessary-lambda
    "W0404",  # reimport
    "W0613",  # unused-argument
]
enable = [
    "E",     # все ошибки
    "W",     # все предупреждения
    "C",     # все рекомендации по стилю
    "R",     # все рефакторинг-предложения
]

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "db", "id", "pk", "e"]

[tool.pylint.design]
max-args = 7
max-locals = 20

[tool.pylint.typecheck]
generated-members = ["_", "objects", "DoesNotExist", "MultipleObjectsReturned"]

[tool.pylint.main]
ignore = ["migrations", ".venv", "__pycache__"]

# ---------- PYTEST ----------
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=backend",
    "--cov=bot",
    "--cov-report=term",
    "--cov-report=html",
]
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# ---------- COVERAGE ----------
[tool.coverage.run]
source = ["backend", "bot"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "*/settings.py",
    "*/manage.py",
    "*/wsgi.py",
    "*/asgi.py",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]
ignore_errors = true
show_missing = true
skip_empty = true

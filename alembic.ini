# ALEMBIC CONFIGURATION

[alembic]
# Путь к миграциям
script_location = backend/migrations

# Добавить корень проекта в PYTHONPATH
prepend_sys_path = .

# Разделитель путей версий (os для Linux/Mac, ; для Windows)
version_path_separator = os

# ⚠URL будет переопределён в env.py из settings.DATABASE_URL
# Оставляем пустым или используем значение по умолчанию
sqlalchemy.url = driver://user:pass@localhost/dbname

# LOGGING

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
ignore_missing_imports = True
exclude = backend/migrations/|\.venv/|__pycache__/|htmlcov/
follow_imports = normal
strict_optional = True
explicit_package_bases = True
namespace_packages = True
show_error_codes = True
show_column_numbers = True
pretty = True
no_implicit_optional = True
strict_equality = True
disallow_any_generics = True
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Сторонние библиотеки без стабов
[mypy-maxapi.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-pytz.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-tenacity.*]
ignore_missing_imports = True

# Backend — строго для сервисов и утилит
[mypy-backend.app.services.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disable_error_code = attr-defined,call-arg,return-value

[mypy-backend.app.utils.auth]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Backend — ORM-специфику временно отключаем
[mypy-backend.app.models.*]
disallow_untyped_defs = False
disable_error_code = attr-defined,call-arg,arg-type,return-value,assignment,valid-type,misc

[mypy-backend.app.api.*]
disallow_untyped_defs = False
disable_error_code = attr-defined,call-arg,arg-type,return-value,assignment,valid-type,misc

[mypy-backend.app.main]
disallow_untyped_defs = False
disable_error_code = attr-defined,call-arg,arg-type,return-value,assignment,valid-type,misc

# Bot — мягко
[mypy-bot.*]
disallow_untyped_defs = False
check_untyped_defs = True

# Tests
[mypy-tests.*]
disallow_untyped_defs = False

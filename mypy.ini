[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = false
ignore_missing_imports = True
exclude = backend/migrations/|\.venv/|__pycache__/
follow_imports = normal
strict_optional = True
explicit_package_bases = True

[mypy-maxapi.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_errors = True

[mypy-backend.app.*]
ignore_errors = True

[mypy-backend.app.services]
disallow_untyped_defs = False
check_untyped_defs = True
ignore_errors = False

[mypy-backend.app.api]
disallow_untyped_defs = False
ignore_errors = False

[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = migrations/|staticfiles/|media/|\.venv/|__pycache__/|tests\.py|.*/tests/|bot/__pycache__/
plugins =
follow_imports = normal
warn_redundant_casts = True
warn_unused_ignores = False
warn_no_return = True
warn_unreachable = False
strict_optional = True
explicit_package_bases = True

# Исключения для библиотек, у которых нет типов
[mypy-maxapi.*]
ignore_missing_imports = True

[mypy-bcrypt.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-pytz.*]
ignore_missing_imports = True

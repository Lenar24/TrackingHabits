services:
  db:
    image: postgres:15
    container_name: habit-db
    environment:
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: habit_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresql"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: habit-backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgresql:postgresql@db:5432/habit_tracker
      SECRET_KEY: ${SECRET_KEY}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      API_URL: http://backend:8000
      TZ: Europe/Moscow
    volumes:
      - ./backend:/app/backend
      - ./alembic.ini:/app/alembic.ini  # <-- Добавляем монтирование alembic.ini
      - ./backend/migrations:/app/migrations  # <-- Добавляем монтирование папки migrations
    restart: always
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: habit-bot
    ports:
      - "8001:8001"
    depends_on:
      backend:
        condition: service_started
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      API_URL: http://backend:8000  # Внутреннее имя сервиса
      WEBHOOK_URL: ${WEBHOOK_URL}
    volumes:
      - ./bot:/app/bot
      - ./backend:/app/backend
    restart: always
    command: poetry run python bot/main_with_api.py

volumes:
  postgres_data:
